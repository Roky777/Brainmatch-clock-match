<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Analog clock showing 1 o'clock</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#694C43" flood-opacity=".22"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="104" fill="#F59E8B" opacity=".3"/>
  <circle cx="120" cy="120" r="92" fill="#FFFDF5" stroke="#5B4B49" stroke-width="7" filter="url(#shadow)"/>
  <g stroke="#5B4B49" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(0 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(30 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(60 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(90 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(120 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(150 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(180 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(210 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(240 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(270 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(300 120 120)"/>
    <line x1="120" y1="25" x2="120" y2="34" transform="rotate(330 120 120)"/>
  </g>
  <g fill="#5B4B49" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="120" y="42">12</text>
    <text x="159" y="52">1</text>
    <text x="187" y="80">2</text>
    <text x="198" y="124">3</text>
    <text x="184" y="166">4</text>
    <text x="157" y="194">5</text>
    <text x="120" y="204">6</text>
    <text x="82" y="194">7</text>
    <text x="53" y="166">8</text>
    <text x="42" y="124">9</text>
    <text x="53" y="80">10</text>
    <text x="80" y="52">11</text>
  </g>
  <g stroke-linecap="round">
    <line x1="120" y1="120" x2="120" y2="55" stroke="#E05E67" stroke-width="9"/>
    <line x1="120" y1="120" x2="120" y2="77" stroke="#365A7A" stroke-width="12" transform="rotate(30 120 120)"/>
  </g>
  <circle cx="120" cy="120" r="10" fill="#F3B63A" stroke="#5B4B49" stroke-width="4"/>
</svg>

